@for (post of savedPosts(); track post._id) {
  <!-- Post Card -->
  <article class="bg-white rounded-2xl border border-[#e0e7f0] shadow-sm overflow-hidden mb-4">
    <!-- Post Header -->
    <div class="p-4">
      <div class="flex items-start justify-between">
        <div class="flex items-center gap-3">
          <img
            [src]="post.user.photo"
            [alt]="post.user.name"
            class="w-10 h-10 rounded-full object-cover"
          />

          <div>
            <h3 class="text-sm font-bold text-[#172033]">{{ post.user.name }}</h3>
            <p class="text-xs text-slate-500 mt-0.5">{{ post.user.username }}</p>
          </div>
        </div>

        <a
          [routerLink]="['/post-details', post._id]"
          class="text-xs font-semibold text-blue-600 hover:text-blue-800 cursor-pointer"
        >
          View details
        </a>
      </div>

      <!-- Post Content -->
      <p class="text-sm text-[#263449] mt-4 mb-4">{{ post.body }}</p>
      @if (post.image) {
        <img [src]="post.image" alt="" class="w-full max-h-90 object-cover rounded-2xl mb-2" />
      }
    </div>

    <!-- Post Footer -->
    <div
      class="border-t border-[#e0e7f0] px-4 py-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3"
    >
      <div class="flex items-center gap-4 text-xs text-[#53647d]">
        <button (click)="likePost(post._id)" class="flex items-center gap-2 hover:text-blue-600">
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M7 10v12m0-12L4 8a2 2 0 0 1 0-3l1-1a2 2 0 0 1 3 0l3 3h7a2 2 0 0 1 2 2l-1 7a3 3 0 0 1-3 2H7"
            />
          </svg>
          {{ post.likesCount }} likes
        </button>

        <button (click)="sharePost(post._id)" class="flex items-center gap-2 hover:text-blue-600">
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4m14-2v2a4 4 0 0 1-4 4H3"
            />
          </svg>
          {{ post.sharesCount }} shares
        </button>

        <button
          [routerLink]="['/post-details', post._id]"
          class="flex items-center gap-2 hover:text-blue-600"
        >
          <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 1 1 16.1-3.8z"
            />
          </svg>
          {{ post.commentsCount }} comments
        </button>
      </div>

      <!-- Date -->
      <div class="flex items-center gap-2 text-xs text-slate-500 font-semibold">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="9" stroke-width="2" />
          <path stroke-width="2" stroke-linecap="round" d="M12 7v5l3 2" />
        </svg>
        {{ post.createdAt | date: 'MMM d, h:mm a' }}
      </div>
    </div>
  </article>
}
