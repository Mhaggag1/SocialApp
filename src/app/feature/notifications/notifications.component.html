<div class="min-h-screen bg-slate-100 p-6 flex justify-center">
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
    <!-- Top Header & Mark All as Read Button -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h2 class="text-2xl font-bold text-slate-800">Notifications</h2>
        <p class="text-sm text-slate-400 mt-1">
          Realtime updates for likes, comments, shares, and follows.
        </p>
      </div>
      <button
        class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-medium transition duration-200 self-start sm:self-auto"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 text-slate-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          />
        </svg>
        Mark all as read
      </button>
    </div>

    <!-- Filter Buttons (All / Unread) -->
    <div class="flex items-center gap-2 mb-6">
      <button
        class="px-5 py-2 rounded-full bg-blue-600 text-white font-medium text-sm shadow-sm transition duration-200"
      >
        All
      </button>
      <button
        class="px-5 py-2 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium text-sm transition duration-200"
      >
        Unread
      </button>
    </div>

    <!-- Divider Line -->
    <hr class="border-slate-100 mb-6" />

    <!-- Empty State Box -->
    <div
      class="border border-slate-200/80 rounded-2xl py-16 flex items-center justify-center text-slate-400 text-sm"
    >
      No notifications yet.
    </div>
  </div>
</div>
