<section class="w-3/4 max-w-xl mx-auto my-10 rounded-xl shadow-2xl p-6 bg-white">
  <h2 class="font-bold text-3xl text-gray-900">Change Password</h2>
  <p class="text-gray-400">Update your account password</p>

  <form
    [formGroup]="changePasswordForm"
    (ngSubmit)="submitChangePassword()"
    class="grid gap-4 mt-4"
  >
    <!-- Current Password -->
    <div>
      <div class="relative">
        <input
          [class]="{
            'border-red-500':
              changePasswordForm.get('password')?.invalid &&
              changePasswordForm.get('password')?.touched,
            'border-green-500': changePasswordForm.get('password')?.valid,
          }"
          formControlName="password"
          #currentPasswordInput
          type="password"
          id="currentPassword"
          class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-heading bg-transparent rounded-base border border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer"
          placeholder=" "
        />
        <label
          for="currentPassword"
          class="absolute text-sm text-body duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-left bg-neutral-primary px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto inset-s-1"
        >
          Current Password
        </label>
        <div class="absolute top-1/2 -translate-y-1/2 right-4 cursor-pointer">
          <i
            (click)="togglePassword(currentPasswordInput)"
            [class]="
              currentPasswordInput.type === 'password'
                ? 'fa-solid fa-eye'
                : 'fa-solid fa-eye-slash'
            "
          ></i>
        </div>
      </div>
    </div>

    <!-- New Password -->
    <div>
      <div class="relative">
        <input
          [class]="{
            'border-red-500':
              changePasswordForm.get('newPassword')?.invalid &&
              changePasswordForm.get('newPassword')?.touched,
            'border-green-500': changePasswordForm.get('newPassword')?.valid,
          }"
          formControlName="newPassword"
          #newPasswordInput
          type="password"
          id="newPassword"
          class="block px-2.5 pb-2.5 pt-4 w-full text-sm text-heading bg-transparent rounded-base border border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer"
          placeholder=" "
        />
        <label
          for="newPassword"
          class="absolute text-sm text-body duration-300 transform -translate-y-4 scale-75 top-2 z-10 origin-left bg-neutral-primary px-2 peer-focus:px-2 peer-focus:text-fg-brand peer-placeholder-shown:scale-100 peer-placeholder-shown:-translate-y-1/2 peer-placeholder-shown:top-1/2 peer-focus:top-2 peer-focus:scale-75 peer-focus:-translate-y-4 rtl:peer-focus:translate-x-1/4 rtl:peer-focus:left-auto inset-s-1"
        >
          New Password
        </label>
        <div class="absolute top-1/2 -translate-y-1/2 right-4 cursor-pointer">
          <i
            (click)="togglePassword(newPasswordInput)"
            [class]="
              newPasswordInput.type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash'
            "
          ></i>
        </div>
      </div>
    </div>

    @if (successMessage()) {
      <div
        class="flex items-start sm:items-center p-4 my-3 text-sm text-fg-success-strong rounded-base bg-success-soft"
        role="alert"
      >
        <p>{{ successMessage() }}</p>
      </div>
    }

    @if (errorMessage()) {
      <div
        class="flex items-start sm:items-center p-4 my-3 text-sm text-fg-danger-strong rounded-base bg-danger-soft"
        role="alert"
      >
        <p>{{ errorMessage() }}</p>
      </div>
    }

    <button
      type="submit"
      class="bg-blue-900 rounded-2xl py-2 text-white cursor-pointer disabled:bg-blue-300 disabled:text-gray-200 disabled:cursor-no-drop"
    >
      @if (isLoading()) {
        <i class="fa-solid fa-circle-notch fa-spin"></i>
      } @else {
        Update Password
      }
    </button>
  </form>
</section>
